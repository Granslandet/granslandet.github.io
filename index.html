<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gränslandet</title>
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #172128;
      color: #f4f1eb;

    main { padding: 1.5rem; }
    h1 { margin: 0; font: normal clamp(2.5rem, 9vw, 6rem)/1.1 Georgia, serif; }

  <main>
    <h1>Gränslandet</h1>
    <p>Musiken har hittat hem. Mer kommer snart.</p>
