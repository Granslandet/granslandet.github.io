<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gränsland</title>
  <style>
    body { margin: 0; background: #202323; color: #eee9dd; font: 1rem/1.5 system-ui,sans-serif; }
    main { max-width: 128rem; margin: auto; }
    .vridtips { display: none; padding: .8rem 1rem; }
    .vridtips p { margin: 0; font-size: 1.15rem; font-weight: 650; }
    .vridtips svg { width: 3.75rem; color: #e8c86e; }
    .vridtips button {
      background: transparent; border: 0; color: #e8c86e; font: inherit;
      padding: .5rem 0; text-decoration: underline; cursor: pointer;
    }
    @media (orientation: portrait) and (max-width: 600px) and (pointer: coarse) {
      .vridtips:not([hidden]) { display: flex; align-items: center; gap: 1rem; border-bottom: 2px solid #b49b53; }
    }
    .stad { position: relative; }
    img { display: block; width: 100%; height: auto; }
    .plats { position: absolute; left: 5.4%; top: 66.5%; transform: translate(-50%, -50%); width: 6%; height: 14%; min-width: 44px; min-height: 44px; border-radius: .4rem; }
    .grav {
      position: absolute;
      left: 12.3%;
      top: 47.3%;
      transform: translate(-50%, -50%);
      width: max(24px, 2.8%);
      height: max(24px, 5%);
      display: grid;
      place-items: center;
      text-decoration: none;
      outline: none;
      color: #aaa69e;
      -webkit-tap-highlight-color: transparent;
    }
    .grav svg { opacity: 0; width: .85rem; height: 1.2rem; }
    @media (hover: hover) {
      .grav:hover svg { opacity: .65; transition: opacity 240ms ease-out 550ms; }
    }
    .grav:focus-visible svg, .grav:active svg { opacity: 1; transition: none; }
    @media (prefers-reduced-motion: reduce) {
      .grav:hover svg { transition-duration: 0s; }
    }
    .bank { left: 9.5%; top: 55%; width: 6%; height: 7%; }
    .havsbank { left: 93.3%; top: 71.1%; width: 7%; height: 8.5%; }
    .fonster { left: 64.7%; top: 39.8%; width: 1.8%; height: 4%; }
    .plats.fonster span { left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; }
    .strand { left: 85%; top: 52%; width: 10%; height: 8%; }
    .plats.strand span, .plats.havsbank span { right: 0; left: auto; top: 100%; width: max-content; }
    .plats:hover, .plats:focus-visible { outline: 2px solid #e8c86e; background: #e8c86e18; }
    .plats span { opacity: 0; position: absolute; left: 100%; top: 25%; background: #202323; padding: .3rem .8rem; }
    .plats:hover span, .plats:focus-visible span { opacity: 1; }
    a { color: #f2d67d; }
    nav { padding: 1rem; }
  </style>
</head>
<body>
  <main aria-label="Gränsland">
    <aside class="vridtips" aria-label="Visningstips">
      <svg viewBox="0 0 64 52" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="33" rx="3" opacity=".6"/>
        <path d="M26 7c11 0 19 7 21 17m-7-5 7 6 5-8"/>
        <rect x="24" y="31" width="36" height="18" rx="3"/>
        <path d="M55 38v4"/>
      </svg>
      <div>
        <p>Vrid mobilen till liggande läge</p>
        <button type="button" hidden>Fortsätt i stående läge</button>
      </div>
    </aside>
    <script>
      const tips = document.querySelector(".vridtips");
      const fortsatt = tips.querySelector("button");
      const nyckel = "gransland-vridtips-dolt";
      try { tips.hidden = sessionStorage.getItem(nyckel) === "ja"; } catch {}
      fortsatt.hidden = false;
      fortsatt.addEventListener("click", () => {
        tips.hidden = true;
        try { sessionStorage.setItem(nyckel, "ja"); } catch {}
        document.querySelector(".stad a").focus({ preventScroll: true });
      });
    </script>
    <div class="stad">
      <img src="staden.png" alt="Gränsland. En stad i dis vid havet. Till vänster står en parkbänk under trädet och en stoppskylt vid korsningen. Bakom bänken ligger en liten skogskyrkogård. Ett fönster lyser i hyreshuset. Till höger möter den steniga stranden havet. En bänk blickar ut över vattnet.">
      <a class="plats" href="latar/stopp/"><span>Stopp</span></a>
      <a class="plats bank" href="singlar/saknad/"><span>Saknad</span></a>
      <a class="plats strand" href="latar/when-tomorrow-comes/"><span lang="en">When Tomorrow Comes</span></a>
      <a class="plats fonster" href="latar/inte-min-tur-an/"><span>Inte min tur än</span></a>
      <a class="plats havsbank" href="latar/jag-reser-mig-igen/"><span>Jag reser mig igen!</span></a>
      <a class="grav" href="till-minne/" aria-label="Till minne av Carolines vän"><svg viewBox="0 0 14 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 1v18M2 7h10"/></svg></a>
    </div>
    <nav aria-label="Låtar">Låtar · <a href="singlar/saknad/">Saknad</a> · <a href="latar/stopp/">Stopp</a> · <a href="latar/when-tomorrow-comes/" lang="en">When Tomorrow Comes</a> · <a href="latar/inte-min-tur-an/">Inte min tur än</a> · <a href="latar/jag-reser-mig-igen/">Jag reser mig igen!</a></nav>
    <nav aria-label="Om projektet"><a href="om/">Om Gränsland</a></nav>
  </main>
</body>
</html>
