<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gränsland</title>
  <style>
    body { margin: 0; background: #202323; color: #eee9dd; font: 1rem/1.5 system-ui,sans-serif; }
    main { max-width: 128rem; margin: auto; }
    .vridtips { display: none; padding: .8rem 1rem; }
    .vridtips p { margin: 0; font-size: 1.15rem; font-weight: 650; }
    .vridtips svg { width: 3.75rem; color: #e8c86e; }
    .vridtips button {
      background: transparent; border: 0; color: #e8c86e; font: inherit;
      padding: .5rem 0; text-decoration: underline; cursor: pointer;
    }
    @media (orientation: portrait) and (max-width: 600px) and (pointer: coarse) {
      .vridtips:not([hidden]) { display: flex; align-items: center; gap: 1rem; border-bottom: 2px solid #b49b53; }
    }
    .skymning, .gryning { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
    .stad { position: relative; }
    img { display: block; width: 100%; height: auto; }
    .plats { position: absolute; left: 5.4%; top: 66.5%; transform: translate(-50%, -50%); width: 6%; height: 14%; min-width: 44px; min-height: 44px; border-radius: .4rem; }
    .grav {
      position: absolute;
      left: 12.3%;
      top: 47.3%;
      transform: translate(-50%, -50%);
      width: max(24px, 2.8%);
      height: max(24px, 5%);
      display: grid;
      place-items: center;
      text-decoration: none;
      outline: none;
      color: #aaa69e;
      -webkit-tap-highlight-color: transparent;
    }
    .grav svg { opacity: 0; width: .85rem; height: 1.2rem; }
    @media (hover: hover) {
      .grav:hover svg { opacity: .65; transition: opacity 240ms ease-out 550ms; }
    }
    .grav:focus-visible svg, .grav:active svg { opacity: 1; transition: none; }
    @media (prefers-reduced-motion: reduce) {
      .grav:hover svg { transition-duration: 0s; }
    }
    .bank { left: 9.5%; top: 55%; width: 6%; height: 7%; }
    .barn { left: 68%; top: 56.8%; width: 2%; height: 6%; }
    .plats.barn span { white-space: nowrap; }
    .havsbank { left: 93.3%; top: 71.1%; width: 7%; height: 8.5%; }
    .fonster { left: 64.7%; top: 39.8%; width: 1.8%; height: 4%; }
    .plats.fonster span { left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; }
    .strand { left: 85%; top: 52%; width: 10%; height: 8%; }
    .plats.strand span, .plats.havsbank span { right: 0; left: auto; top: 100%; width: max-content; }
    .plats:hover, .plats:focus-visible { outline: 2px solid #e8c86e; background: #e8c86e18; }
    .plats span { opacity: 0; position: absolute; left: 100%; top: 25%; background: #202323; padding: .3rem .8rem; }
    .plats:hover span, .plats:focus-visible span { opacity: 1; }
    a { color: #f2d67d; }
    nav { padding: 1rem; }
  </style>
</head>
<body>
  <main aria-label="Gränsland">
    <aside class="vridtips" aria-label="Visningstips">
      <svg viewBox="0 0 64 52" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="33" rx="3" opacity=".6"/>
        <path d="M26 7c11 0 19 7 21 17m-7-5 7 6 5-8"/>
        <rect x="24" y="31" width="36" height="18" rx="3"/>
        <path d="M55 38v4"/>
      </svg>
      <div>
        <p>Vrid mobilen till liggande läge</p>
        <button type="button" hidden>Fortsätt i stående läge</button>
      </div>
    </aside>
    <script>
      const tips = document.querySelector(".vridtips");
      const fortsatt = tips.querySelector("button");
      const nyckel = "gransland-vridtips-dolt";
      try { tips.hidden = sessionStorage.getItem(nyckel) === "ja"; } catch {}
      fortsatt.hidden = false;
      fortsatt.addEventListener("click", () => {
        tips.hidden = true;
        try { sessionStorage.setItem(nyckel, "ja"); } catch {}
        document.querySelector(".stad a").focus({ preventScroll: true });
      });
    </script>
    <div class="stad">
      <img src="staden.png" alt="Gränsland. En stad i dis vid havet. Till vänster står en parkbänk under trädet och en stoppskylt vid korsningen. Bakom bänken ligger en liten skogskyrkogård. Ett fönster lyser i hyreshuset. På gångvägen går en flicka med skolväska mot porten. Till höger möter den steniga stranden havet. En bänk blickar ut över vattnet.">
      <canvas class="skymning" aria-hidden="true"></canvas>
      <canvas class="gryning" aria-hidden="true"></canvas>
      <a class="plats" href="latar/stopp/"><span>Stopp</span></a>
      <a class="plats bank" href="singlar/saknad/"><span>Saknad</span></a>
      <a class="plats strand" href="latar/when-tomorrow-comes/"><span lang="en">When Tomorrow Comes</span></a>
      <a class="plats fonster" href="latar/inte-min-tur-an/"><span>Inte min tur än</span></a>
      <a class="plats havsbank" href="latar/jag-reser-mig-igen/"><span>Jag reser mig igen!</span></a>
      <a class="plats barn" href="latar/barn-av-var-tid/"><span>Barn av vår tid</span></a>
      <a class="grav" href="till-minne/" aria-label="Till minne av Carolines vän"><svg viewBox="0 0 14 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 1v18M2 7h10"/></svg></a>
    </div>
    <nav aria-label="Låtar">Låtar · <a href="singlar/saknad/">Saknad</a> · <a href="latar/stopp/">Stopp</a> · <a href="latar/when-tomorrow-comes/" lang="en">When Tomorrow Comes</a> · <a href="latar/inte-min-tur-an/">Inte min tur än</a> · <a href="latar/jag-reser-mig-igen/">Jag reser mig igen!</a> · <a href="latar/barn-av-var-tid/">Barn av vår tid</a></nav>
    <nav aria-label="Om projektet"><a href="om/">Om Gränsland</a></nav>
  </main>
  <script type="module">
const photo = document.querySelector('.stad img');
const layer = document.querySelector('.skymning');
const dawnLayer = document.querySelector('.gryning');
function solarPosition(now) {
  const rad = Math.PI / 180;
  const days = now.getTime() / 86400000 - 10957.5;
  const anomaly = (357.529 + .98560028 * days) * rad;
  const longitude = (280.459 + .98564736 * days + 1.915 * Math.sin(anomaly) + .020 * Math.sin(2 * anomaly)) * rad;
  const tilt = 23.44 * rad;
  const declination = Math.asin(Math.sin(tilt) * Math.sin(longitude));
  const ascension = Math.atan2(Math.cos(tilt) * Math.sin(longitude), Math.cos(longitude));
  // Solar altitude at Landskrona, calculated from UTC.
  const hourAngle = (280.4606 + 360.9856474 * days + 12.83) * rad - ascension;
  const latitude = 55.87 * rad;
  const altitude = Math.asin(Math.sin(latitude)*Math.sin(declination) + Math.cos(latitude)*Math.cos(declination)*Math.cos(hourAngle)) / rad;
  return { altitude, rising: Math.sin(hourAngle) < 0 };
}
function update() {
  const { altitude, rising } = solarPosition(new Date());
  layer.style.opacity = 1 - smooth(-8, 5, altitude);
  dawnLayer.style.opacity = rising ? 1 - smooth(0, 6, Math.abs(altitude)) : 0;
}
function smooth(low, high, value) {
  const t = Math.max(0, Math.min(1, (value-low)/(high-low)));
  return t*t*(3-2*t);
}
function dawnAlpha(u, v) {
  const coast = smooth(.76, .94, u);
  const sky = 1 - smooth(0, .15, Math.abs(v - .43));
  const water = (1 - smooth(0, .12, Math.abs(v - .52))) * smooth(.85, .99, u);
  return coast * (.34 * sky + .12 * water);
}
function prepareDawn() {
  const w = dawnLayer.width = photo.naturalWidth;
  const h = dawnLayer.height = photo.naturalHeight;
  const ctx = dawnLayer.getContext('2d');
  const pixels = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = 4 * (y * w + x);
      pixels.data[i] = 255;
      pixels.data[i+1] = 213;
      pixels.data[i+2] = 167;
      pixels.data[i+3] = Math.round(255 * dawnAlpha(x/w, y/h));
    }
  }
  ctx.putImageData(pixels,0,0);
}
function prepare() {
  const w = layer.width = photo.naturalWidth;
  const h = layer.height = photo.naturalHeight;
  const ctx = layer.getContext('2d');
  ctx.drawImage(photo,0,0);
  const pixels = ctx.getImageData(0,0,w,h);
  const data = pixels.data;
  for (let y=0; y<h; y++) {
    const v=y/h;
    for (let x=0; x<w; x++) {
      const u=x/w, i=4*(y*w+x);
      const r=data[i], g=data[i+1], b=data[i+2];
      const light=.2126*r+.7152*g+.0722*b;
      const titleArea = smooth(.24,.28,u) * (1-smooth(.72,.77,u)) * (1-smooth(.22,.28,v));
      const title = titleArea * smooth(5,24,g-b);
      // Feather both skyline and shoreline to avoid cutting a line through the mist.
      const shore = smooth(.69,.83,u);
      const land = smooth(.21,.34,v) * (1-shore*(1-smooth(.59,.78,v)));
      const glow = smooth(111,186,light);
      const warmWindow = smooth(82,145,light)*smooth(10,40,r-b);
      const protect = Math.max(title,land*Math.max(glow,warmWindow));
      data[i]=13; data[i+1]=23; data[i+2]=42;
      data[i+3]=Math.round(255*(.69-.15*v)*(1-protect));
    }
  }
  ctx.putImageData(pixels,0,0);
  prepareDawn();
  setInterval(update, 60000);
  document.addEventListener('visibilitychange', update);
  update();
}

if (photo.complete && photo.naturalWidth) prepare();
else photo.addEventListener('load',prepare,{once:true});
</script>
</body>
</html>
